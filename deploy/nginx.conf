# /etc/nginx/sites-available/legacy-flow
#   ln -s /etc/nginx/sites-available/legacy-flow /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# TLS is added by:  certbot --nginx -d dynamicblack.network -d www.dynamicblack.network
#
# Maintenance mode: while /opt/legacy-flow/.suspended exists, every request gets the
# notice page with HTTP 503 and nothing reaches the app. Use `legacy-flow suspend`
# and `legacy-flow resume` rather than editing this file.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dynamicblack.network www.dynamicblack.network _;

    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 20m;   # lead files and HR documents

    error_page 503 @suspended;
    if (-f /opt/legacy-flow/.suspended) {
        return 503;
    }

    location @suspended {
        root /var/www/legacy-flow-suspended;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
