# /etc/nginx/sites-available/legacy-flow  (then: ln -s ... sites-enabled/ && nginx -t && systemctl reload nginx)
# TLS certificates: certbot --nginx -d crm.example.com

server {
    listen 80;
    server_name crm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.example.com;

    # managed by certbot
    # ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 20m;   # lead files and HR documents

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
